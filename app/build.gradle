plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gardockt.termuxterminalwidget'
    compileSdk 34

    defaultConfig {
        applicationId "com.gardockt.termuxterminalwidget"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue 'string', 'app_name', 'Termux Terminal Widget'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            resValue 'string', 'app_name', 'Termux Terminal Widget (Debug)'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.jaredrummler:colorpicker:1.1.0'
    implementation 'com.termux.termux-app:termux-shared:v0.118.0'
    implementation 'com.google.guava:guava:29.0-android'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation "androidx.work:work-runtime:2.8.1"
}