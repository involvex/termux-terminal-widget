plugins {
    id 'com.android.application'
}

android {
    namespace 'com.invapp.terminalwidget'
    compileSdk 34

    defaultConfig {
        applicationId "com.involvex.termux_app.terminalwidget"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue 'string', 'app_name', 'InVx:Terminal Widget'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            resValue 'string', 'app_name', 'InVx:Terminal Widget (Debug)'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.jaredrummler:colorpicker:1.1.0'
    // InVxTermux termux-shared published locally from involvex/termux-app with:
    // ./gradlew :termux-shared:publishReleasePublicationToMavenLocal (requires mavenLocal() in settings.gradle).
    // Upstream used: implementation 'com.termux.termux-app:termux-shared:0.118.0'
    implementation 'com.invapp:termux-shared:0.203.0'
    implementation 'com.google.guava:guava:29.0-android'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
}